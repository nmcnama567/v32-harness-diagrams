" font-weight="normal">LED_A (K50 coil node via R58 1k) · 20 AWG</text><rect x="420" y="229" width="62" height="22" rx="4" stroke="#888" fill="#fff" stroke-width="1.2"/><text x="451" y="244" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">SW 1</text><path d="M 482 240 L 1330 240" stroke="#757575" stroke-width="2.0" fill="none" stroke-linecap="round"/><text x="700" y="233" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">SW_ARM (arms K50 master relay via Q50) · 20 AWG</text><rect x="420" y="279" width="62" height="22" rx="4" stroke="#888" fill="#fff" stroke-width="1.2"/><text x="451" y="294" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">SW 1a</text><path d="M 482 290 L 1330 290" stroke="#c62828" stroke-width="2.0" fill="none" stroke-linecap="round"/><text x="700" y="283" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">ES_FEED — ALWAYS HOT (13 V via R92 470R) · 20 AWG</text><rect x="420" y="329" width="62" height="22" rx="4" stroke="#888" fill="#fff" stroke-width="1.2"/><text x="451" y="344" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">SW 2</text><path d="M 482 340 L 1330 340" stroke="#757575" stroke-width="2.0" fill="none" stroke-linecap="round"/><text x="700" y="333" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">PWR_SW (LM5176 enable · R61 470k pull-up) · 20 AWG</text><rect x="420" y="379" width="62" height="22" rx="4" stroke="#888" fill="#fff" stroke-width="1.2"/><text x="451" y="394" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">SW 2a</text><path d="M 482 390 L 1330 390" stroke="#212121" stroke-width="2.0" fill="none" stroke-linecap="round"/><text x="700" y="383" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">GND — switch return · 20 AWG</text><rect x="420" y="429" width="62" height="22" rx="4" stroke="#888" fill="#fff" stroke-width="1.2"/><text x="451" y="444" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold">LED −</text><path d="M 482 440 L 1330 440" stroke="#212121" stroke-width="2.0" fill="none" stroke-linecap="round"/><text x="700" y="433" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#333" text-anchor="start" font-weight="normal">GND — LED return · 20 AWG</text><rect x="1330" y="140" width="262" height="340" rx="8" stroke="#555" fill="#fafaf8" stroke-width="1.8"/><text x="1342" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold">J50 · Micro-Fit 6</text><text x="1342" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#666" text-anchor="start" font-weight="normal">43025-0600 → PWR board 43045-0612</text><line x1="1328" y1="190" x2="1337" y2="190" stroke="#555" stroke-width="2" stroke-linecap="round"/><text x="1344" y="194" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222" text-anchor="start" font-weight="bold">1</text><line x1="1328" y1="240" x2="1337" y2="240" stroke="#555" stroke-width="2" stroke-linecap="round"/><text x="1344" y="244" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222" text-anchor="start" font-weight="bold">2</text><line x1="1328" y1="290" x2="1337" y2="290" stroke="#555" stroke-width="2" stroke-linecap="round"/><text x="1344" y="294" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222" text-anchor="start" font-weight="bold">3</text><line x1="1328" y1="