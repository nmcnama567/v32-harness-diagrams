t-weight="bold">4</text><rect x="1450" y="250" width="42" height="42" rx="3" stroke="#999" fill="#fff" stroke-width="1.1"/><text x="1471.0" y="275.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">5</text><rect x="1492" y="250" width="42" height="42" rx="3" stroke="#999" fill="#fff" stroke-width="1.1"/><text x="1513.0" y="275.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">6</text><text x="1471.0" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#666" text-anchor="middle" font-weight="normal">pin 1 opposite pin 4</text><text x="1471.0" y="325" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#666" text-anchor="middle" font-weight="normal">polarized — one-way fit</text><text x="1471.0" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#666" text-anchor="middle" font-weight="normal">numbers unchanged from XH-6</text><rect x="640" y="500" width="648" height="92" rx="8" stroke="#c62828" fill="#fdf3f2" stroke-width="2"/><text x="656" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a1414" text-anchor="start" font-weight="bold" letter-spacing="0.5">⚠ LIVE WITH KIT SWITCHED OFF</text><text x="656" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a1414" text-anchor="start" font-weight="normal">Pin 3 ES_FEED ≈13 V whenever the battery is connected (VCAP_IN → F50 → D50 → /ES_RX → R92 470R —</text><text x="656" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7a1414" text-anchor="start" font-weight="normal">does NOT pass through the master relay). Pin 4 PWR_SW ≈13 V via R61 470k (weak). Treat both as live.</text><line x1="36" y1="804" x2="1586" y2="804" stroke="#c9c9c9" stroke-width="1" stroke-linecap="round"/><text x="36" y="828" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#666" text-anchor="start" font-weight="normal">Toggle UP: pole 1 jumpers pin 3 → pin 2 (ES_FEED → SW_ARM arms K50 via Q50 follower) · pole 2 jumpers pin 4 → pin 5 (PWR_SW → GND enables the LM5176) — matches sheet ghosts S50/S52</text><text x="36" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#666" text-anchor="start" font-weight="normal">One wire per contact, crimp-to-crimp, no splices · J50 was XH-6 single-row — now Micro-Fit 2×3, pin numbers 1:1 · schematic rev c md5 26db7fab · PNs per switch-sourcing.md (pending approval)</text></svg>